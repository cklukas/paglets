name: C++ (paglets/cpp)

on:
  push:
    branches:
      - cpp
    paths:
      - ".github/workflows/cpp.yml"
      - "cpp/**"
  pull_request:
    paths:
      - ".github/workflows/cpp.yml"
      - "cpp/**"
  workflow_dispatch:

env:
  WASI_SDK_VERSION: "25"

jobs:
  linux:
    name: Linux ${{ matrix.arch }} (GCC 16)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: gcc:16
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build curl ca-certificates git
      - name: Install wasi-sdk
        run: |
          curl -fsSL -o wasi-sdk.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-${{ matrix.arch }}-linux.tar.gz"
          mkdir -p /opt/wasi-sdk
          tar xzf wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1
      - name: Configure
        working-directory: cpp
        run: cmake --preset linux-gcc16 -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
      - name: Build
        working-directory: cpp
        run: cmake --build --preset linux-gcc16
      - name: Test
        working-directory: cpp
        run: ctest --preset linux-gcc16
      - name: Measurements
        working-directory: cpp/build/linux-gcc16
        run: ./host/paglets-spike bench guests/testbed.wasm guests/counter.wasm --instances 1000
      - name: Upload guest modules
        if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: guests
          path: cpp/build/linux-gcc16/guests/*.wasm

  sanitizers:
    name: Linux x86_64 (GCC 16, ${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan
            preset: linux-gcc16-asan
          - name: TSan
            preset: linux-gcc16-tsan
    runs-on: ubuntu-24.04
    container: gcc:16
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build curl ca-certificates git
          curl -fsSL -o wasi-sdk.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz"
          mkdir -p /opt/wasi-sdk
          tar xzf wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1
      - name: Configure, build and test
        working-directory: cpp
        run: |
          cmake --preset ${{ matrix.preset }} -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build --preset ${{ matrix.preset }}
          ctest --preset ${{ matrix.preset }}

  macos:
    name: macOS arm64 (Homebrew GCC 16)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchains
        run: brew install gcc@16 llvm lld wasi-libc wasi-runtimes ninja
      - name: Configure
        working-directory: cpp
        run: cmake --preset macos-arm64
      - name: Build
        working-directory: cpp
        run: cmake --build --preset macos-arm64
      - name: Test
        working-directory: cpp
        run: ctest --preset macos-arm64

  windows:
    name: Windows x86_64 (MinGW-w64 GCC, experimental)
    runs-on: windows-2025
    needs: linux
    # Not yet verified: WAMR's Windows platform layer with MinGW-w64.
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            git
      - name: Download guest modules
        uses: actions/download-artifact@v4
        with:
          name: guests
          path: prebuilt-guests
      - name: Configure, build and test
        working-directory: cpp
        run: |
          cmake --preset windows-mingw-gcc16 -DPAGLETS_BUILD_GUESTS=OFF \
            -DPAGLETS_PREBUILT_GUEST_DIR="$(cygpath -m "$GITHUB_WORKSPACE/prebuilt-guests")"
          cmake --build --preset windows-mingw-gcc16
          ctest --preset windows-mingw-gcc16
