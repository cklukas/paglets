name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # ckdocs is built from ck-git-hosting at this commit (documentation site generator).
  CKDOCS_REF: 7d693f09c830e8b1272e444d238d8c130d153afa

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          cache-suffix: ci-${{ matrix.python-version }}

      - name: Install project
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest --cov=paglets --cov-report=term-missing --cov-report=xml

      - name: Build ckdocs
        run: |
          git clone --quiet --filter=blob:none https://github.com/cklukas/ck-git-hosting.git "$RUNNER_TEMP/ck-git-hosting"
          git -C "$RUNNER_TEMP/ck-git-hosting" checkout --quiet "$CKDOCS_REF"
          make -C "$RUNNER_TEMP/ck-git-hosting" BUILD_ROOT="$RUNNER_TEMP" BUILD_DIR="$RUNNER_TEMP/ckdocs" client
          echo "$RUNNER_TEMP/ckdocs/bin" >> "$GITHUB_PATH"

      - name: Check documentation
        run: |
          uv run python tools/docs_sync.py --check
          ckdocs check --root .

      - name: Build package
        run: uv build

      - name: Smoke-test wheel installation
        run: |
          python -m venv /tmp/paglets-wheel-smoke
          /tmp/paglets-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/paglets-wheel-smoke/bin/paglets --help
          for command in host sys mesh jobs artifacts search examples; do
            /tmp/paglets-wheel-smoke/bin/paglets "$command" --help
          done

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

      - name: Smoke-test command line entry points
        run: |
          uv run paglets-host --help
          uv run paglets-mesh-benchmark --help
          uv run paglets-mesh-info --help
          uv run paglets-perf-test --help
          uv run paglets-pi-compute --help
          uv run paglets-search --help
          uv run paglets-sysinfo --help
