# Releases of paglets/cpp. Tagging cpp-vMAJOR.MINOR.PATCH (matching
# project(paglets_cpp VERSION ...) in cpp/CMakeLists.txt) builds and tests
# the edition on Linux and macOS, publishes a GitHub release with the source
# archive and SHA256SUMS, and updates the Homebrew formula in the tap
# https://github.com/cklukas/homebrew-paglets (brew install
# cklukas/paglets/paglets). The tap is written with the deploy key in the
# secret HOMEBREW_TAP_DEPLOY_KEY.

name: Release (paglets/cpp)

on:
  push:
    tags: ["cpp-v*"]

permissions:
  contents: write

env:
  WASI_SDK_VERSION: "25"

jobs:
  verify-version:
    name: Verify tag matches the CMake version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          version=$(sed -n 's/^ *VERSION \([0-9][0-9.]*\)$/\1/p' cpp/CMakeLists.txt | head -1)
          if [ "cpp-v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match cpp/CMakeLists.txt version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux x86_64 build and tests
    needs: verify-version
    runs-on: ubuntu-24.04
    container: gcc:16
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build curl ca-certificates git libsodium-dev libssl-dev libzstd-dev pkg-config
          curl -fsSL -o wasi-sdk.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz"
          mkdir -p /opt/wasi-sdk
          tar xzf wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1
      - name: Build and test
        working-directory: cpp
        run: |
          cmake --preset linux-gcc16 -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build --preset linux-gcc16
          ctest --preset linux-gcc16
      - name: Report failed tests
        if: failure()
        run: bash cpp/tools/ci_failures.sh cpp/build/linux-gcc16

  macos:
    name: macOS arm64 build and tests
    needs: verify-version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchains
        run: brew install gcc@16 llvm lld wasi-libc wasi-runtimes ninja libsodium openssl@3 zstd pkgconf
      - name: Build and test
        working-directory: cpp
        run: |
          cmake --preset macos-arm64
          cmake --build --preset macos-arm64
          ctest --preset macos-arm64
      - name: Report failed tests
        if: failure()
        run: bash cpp/tools/ci_failures.sh cpp/build/macos-arm64

  source:
    name: Source archive
    needs: verify-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Archive the tagged tree
        run: |
          version=${{ needs.verify-version.outputs.version }}
          mkdir -p "$RUNNER_TEMP/dist"
          git archive --format=tar.gz --prefix="paglets-cpp-$version/" \
            -o "$RUNNER_TEMP/dist/paglets-cpp-$version-source.tar.gz" "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [verify-version, linux, macos, source]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: ${{ runner.temp }}/artifacts
      - name: Checksums
        run: |
          cd "$RUNNER_TEMP/artifacts"
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ needs.verify-version.outputs.version }}
          {
            echo "# paglets/cpp $version"
            echo
            echo "The C++ edition of paglets: mobile agents as WebAssembly modules, hosts and meshes,"
            echo "\`paglets-host\`, \`paglets-worker\`, and \`paglets-web\` (a local web UI for a mesh)."
            echo
            echo "## Install"
            echo
            echo "macOS (Homebrew): \`brew install cklukas/paglets/paglets\`"
            echo
            echo "From source: unpack \`paglets-cpp-$version-source.tar.gz\` and see"
            echo "[Building and testing](https://cklukas.github.io/paglets/cpp/building.html)."
            echo
            echo "Documentation: https://cklukas.github.io/paglets/cpp/"
          } > "$RUNNER_TEMP/notes.md"
          # The Python edition's releases (v*) stay the repository's latest.
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/artifacts/* \
            --title "paglets/cpp $version" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag --latest=false

  homebrew:
    name: Update the Homebrew tap
    needs: [verify-version, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: ${{ runner.temp }}/source
      - name: Check out the tap
        uses: actions/checkout@v5
        with:
          repository: cklukas/homebrew-paglets
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Write and push the formula
        run: |
          version=${{ needs.verify-version.outputs.version }}
          sha256=$(sha256sum "$RUNNER_TEMP/source/paglets-cpp-$version-source.tar.gz" | cut -d' ' -f1)
          mkdir -p tap/Formula
          sh cpp/packaging/homebrew/update-formula.sh "$version" "$sha256" "$GITHUB_REPOSITORY" tap/Formula/paglets.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/paglets.rb
          git commit -m "paglets $version"
          git push origin HEAD
