#
# The paper on the C++ edition (papers/paglets-cpp) on the ck-git server
# (rpi4), as the hosted project `paglets-paper` whose default branch is
# cpp-paper: every push to `git push ckgit-paper cpp-paper` checks that the
# paper's generated excerpts and tables are current, builds the PDF, keeps
# it as the run's artifact, and publishes the review site (the PDF and an
# index page) on ck-git Pages: http://rpi4:8421/paglets-paper/. This is the
# review copy; publication on GitHub is a separate, explicit step
# (.github/workflows/cpp-paper.yml: a cpp-paper-v* tag).
#
# The runner has no network: TeX Live, gnuplot, jq and g++ come from the
# server itself. The `cpp` branch has its own ci.yml (the documentation
# site); this file replaces it on this branch.
version: 1
on:
  branches: [cpp-paper]
jobs:
  - name: paper
    steps:
      - name: current
        script: |
          mkdir -p "$HOME/sync"
          g++ -std=c++23 -O1 -I cpp/host/include -I cpp/common/include \
            cpp/tools/docs_sync/docs_sync.cpp cpp/host/src/json.cpp -o "$HOME/sync/paglets-docs-sync"
          "$HOME/sync/paglets-docs-sync" --root "$PWD" --check
      - name: pdf
        script: |
          make -C papers/paglets-cpp site
          pdfinfo papers/paglets-cpp/build/paglets-cpp.pdf | grep -E "Pages|Title"
    artifacts:
      name: paper
      paths:
        - papers/paglets-cpp/build/paglets-cpp.pdf
pages:
  path: papers/paglets-cpp/build/site
