#
# Self-hosted CI on the ck-git server (rpi4). Publish this repository there
# with `ckgit publish`; afterwards `git push ckgit <branch>` triggers a run.
#
# The runner has no network by default, so this workflow only builds the
# documentation site with the server's own `ckdocs` (strict: a broken link
# or heading fragment fails the run). The site is a portal over two sites
# (ckdocs.yml): the C++ edition from this branch and the Python edition from
# `main`. The CI checkout has no Git history, so `main` comes in as a sister
# checkout of this same project and is passed to ckdocs with --ref-tree. A
# push to the hosted project's default branch (cpp) publishes the site on
# ck-git Pages. The C++ build and tests run in GitHub Actions
# (.github/workflows/cpp.yml).
version: 1
on:
  branches: [cpp]
sisters:
  - name: paglets
    ref: main
jobs:
  - name: docs
    steps:
      - name: site
        script: |
          if ! command -v ckdocs >/dev/null 2>&1; then
            echo "ckdocs is not installed on the CI server (it comes with ck-git-hosting)" >&2
            exit 1
          fi
          ckdocs build --root "$PWD" --ref-tree main="$CKGIT_SISTER_PAGLETS" --out "$PWD/public" --strict
pages:
  path: public
