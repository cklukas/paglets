#
# Self-hosted CI on the ck-git server (rpi4). Publish this repository there
# with `ckgit publish`; afterwards `git push ckgit <branch>` triggers a run.
#
# The runner has no network by default, so this workflow only builds the
# documentation site with the server's own `ckdocs` (strict: a broken link
# or heading fragment fails the run). A push to the hosted project's default
# branch publishes the site on ck-git Pages. On rpi4 that default is cpp, so
# ck-git Pages shows the docs including paglets/cpp, while GitHub Pages builds
# main through .github/workflows/docs.yml. Tests and the C++ build run in
# GitHub Actions (.github/workflows/ci.yml and cpp.yml).
version: 1
on:
  branches: [main, cpp]
jobs:
  - name: docs
    steps:
      - name: site
        script: |
          if ! command -v ckdocs >/dev/null 2>&1; then
            echo "ckdocs is not installed on the CI server (it comes with ck-git-hosting)" >&2
            exit 1
          fi
          ckdocs build --root "$PWD" --out "$PWD/public" --strict
pages:
  path: public
