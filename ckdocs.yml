#
# Documentation portal for ckdocs (from ck-git-hosting): a welcome page and a
# site selector in every page's header, over two sites. The C++ edition comes
# from docs/ on this branch (configured in docs/ckdocs.yml); the Python
# edition from the `main` branch, with that branch's docs/ckdocs.yml. Build and
# check from the repository root (the clone needs the `main` branch, or pass
# --ref-tree main=DIR with a checkout of it):
#
#   ckdocs check --root .
#   ckdocs build --root . --out public
version: 1
site:
  title: paglets
  description: "Mobile agents that move between hosts with their state, in two independent editions: the Python package, and the C++ edition whose paglets are sandboxed WebAssembly modules."
  footer: "© 2026 C. Klukas · MIT License"
  links:
    - title: GitHub
      url: https://github.com/cklukas/paglets
sites:
  - id: python
    title: Python edition
    description: "The paglets package on PyPI: paglets as Python classes with dataclass state, hosts, meshes, system services and packaged examples."
    ref: main
    config: docs/ckdocs.yml
    redirect_from_root: true
  - id: cpp
    title: C++ edition
    description: "paglets/cpp: paglets as WebAssembly modules that move as memory images, sandboxed workers, a signed mesh ledger and policy, code mobility and content exchange between hosts."
    config: docs/ckdocs.yml
