# Documentation site configuration for ckdocs (from ck-git-hosting). Build and
# check from the repository root:
#
#   ckdocs check --root .
#   ckdocs build --root . --out public
#
# API reference and code snippets inside docs/ are generated into the Markdown
# by tools/docs_sync.py; run it before building when the code changed.
version: 1
site:
  title: paglets
  description: Python Aglets-inspired mobile object runtime.
  footer: "© 2026 C. Klukas · MIT License"
  links:
    - title: GitHub
      url: https://github.com/cklukas/paglets
    - title: PyPI
      url: https://pypi.org/project/paglets/
source: docs
search: true
